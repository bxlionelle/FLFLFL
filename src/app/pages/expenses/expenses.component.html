<div>
  <!-- <app-page-breadcrumb pageTitle="Expenses Page" /> -->
  
  <!-- Header Section -->
  <div class="mb-6">
    <!-- Top Bar with User Info -->
    <div class="flex items-center justify-between mb-6">
      <div class="text-sm text-gray-600 dark:text-gray-400">
        Logged in as: <span class="font-medium text-gray-800 dark:text-white/90">{{ currentUser.name }}</span> • <span class="text-gray-500">{{ currentUser.role }}</span>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          <span class="text-sm font-medium text-gray-800 dark:text-white/90">{{ currentUser.name }}</span>
        </div>
        <span class="px-3 py-1.5 bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 text-xs font-medium rounded-md">
          {{ currentUser.role }}
        </span>
      </div>
    </div>
  </div>

  <!-- Two Column Layout -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Left Column - Submit New Expense -->
    <div class="rounded-xl bg-white p-6 shadow-sm border border-gray-200 dark:border-gray-800 dark:bg-white/[0.03]">
      <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-6">Submit New Expense</h3>

      <form (ngSubmit)="submitExpense()" class="space-y-5">
        <!-- Date -->
        <div>
          <label class="block text-sm font-medium text-gray-900 dark:text-white mb-2">Date</label>
          <input 
            type="date" 
            [(ngModel)]="newExpense.date"
            name="date"
            placeholder="dd/mm/yyyy"
            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   dark:bg-gray-900 dark:border-gray-700 dark:text-white"
          />
        </div>

        <!-- Category -->
        <div>
          <label class="block text-sm font-medium text-gray-900 dark:text-white mb-2">Category</label>
          <input 
            type="text" 
            [(ngModel)]="newExpense.category"
            name="category"
            placeholder="e.g., Travel, Office Supplies, Meals"
            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-500
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   dark:bg-gray-900 dark:border-gray-700 dark:text-gray-400
                   placeholder:text-gray-400 dark:placeholder:text-gray-500"
          />
        </div>

        <!-- Amount -->
        <div>
          <label class="block text-sm font-medium text-gray-900 dark:text-white mb-2">Amount ($)</label>
          <input 
            type="number" 
            [(ngModel)]="newExpense.amount"
            name="amount"
            placeholder="0.00"
            step="0.01"
            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-500
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   dark:bg-gray-900 dark:border-gray-700 dark:text-gray-400
                   placeholder:text-gray-400 dark:placeholder:text-gray-500"
          />
        </div>

        <!-- Description -->
        <div>
          <label class="block text-sm font-medium text-gray-900 dark:text-white mb-2">Description</label>
          <textarea 
            [(ngModel)]="newExpense.description"
            name="description"
            rows="3"
            placeholder="Describe the expense..."
            class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-500 resize-none
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   dark:bg-gray-900 dark:border-gray-700 dark:text-gray-400
                   placeholder:text-gray-400 dark:placeholder:text-gray-500"
          ></textarea>
        </div>

        <!-- Upload Receipt -->
        <div>
          <label class="block text-sm font-medium text-gray-900 dark:text-white mb-2">Upload Receipt</label>
          <div class="relative">
            <input 
              type="file" 
              (change)="onFileSelected($event)"
              accept=".pdf,.jpg,.jpeg,.png"
              class="hidden"
              #fileInput
            />
            <button
              type="button"
              (click)="fileInput.click()"
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-500 text-left
                     hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                     dark:bg-gray-900 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-800
                     flex items-center justify-between transition-colors duration-200"
            >
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <span>Choose File</span>
              </div>
              <span class="text-xs">{{ selectedFileName || 'No file chosen' }}</span>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit"
          class="w-full px-6 py-3 bg-gray-900 hover:bg-gray-800 text-white text-sm font-medium rounded-lg 
                 transition-colors duration-200 dark:bg-white dark:text-gray-900 dark:hover:bg-gray-100"
        >
          Submit Expense
        </button>
      </form>
    </div>

    <!-- Right Column - Expense History -->
    <div class="rounded-xl bg-white p-6 shadow-sm border border-gray-200 dark:border-gray-800 dark:bg-white/[0.03]">
      <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-6">Expense History</h3>

      <div class="space-y-4">
        <div 
          *ngFor="let expense of expenseHistory"
          class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 transition-colors duration-200"
        >
          <!-- Expense Header -->
          <div class="flex items-start justify-between mb-3">
            <div class="flex-1">
              <h4 class="text-base font-semibold text-gray-900 dark:text-white mb-1">{{ expense.category }}</h4>
              <p class="text-sm text-gray-600 dark:text-gray-400">{{ expense.description }}</p>
            </div>
            <span 
              [ngClass]="{
                'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400': expense.status === 'Pending',
                'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400': expense.status === 'Approved',
                'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400': expense.status === 'Rejected'
              }"
              class="px-3 py-1 text-xs font-medium rounded-full ml-3 flex-shrink-0"
            >
              {{ expense.status }}
            </span>
          </div>

          <!-- Expense Details -->
          <div class="flex items-center justify-between text-sm">
            <div class="text-gray-600 dark:text-gray-400">
              <span>{{ expense.date }}</span>
            </div>
            <div class="flex items-center gap-3">
              <div class="flex items-center gap-1.5 text-gray-500 dark:text-gray-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <span class="text-xs">{{ expense.receipt }}</span>
              </div>
              <span class="text-base font-semibold text-gray-900 dark:text-white">
                ${{ expense.amount }}
              </span>
            </div>
          </div>
        </div>

        <!-- Empty State -->
        <div *ngIf="expenseHistory.length === 0" class="text-center py-12">
          <svg class="w-16 h-16 text-gray-300 dark:text-gray-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          <p class="text-sm text-gray-500 dark:text-gray-400">No expenses yet</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Help Button -->
  <button 
    class="fixed bottom-6 right-6 w-12 h-12 bg-gray-900 hover:bg-gray-800 dark:bg-gray-800 dark:hover:bg-gray-700 rounded-full shadow-lg flex items-center justify-center transition-colors duration-200 z-50"
    aria-label="Help"
  >
    <span class="text-white text-lg font-semibold">?</span>
  </button>
</div>
