<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:gap-6">
  <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] md:p-6">
    <div class="flex items-center justify-center w-12 h-12 bg-gray-100 rounded-xl dark:bg-gray-800" [innerHTML]="icons.groupIcon | safeHtml">
    </div>
    <div class="flex items-end justify-between mt-5">
      <div>
        <span class="text-sm text-gray-500 dark:text-gray-400">Users</span>
        <h4 class="mt-2 font-bold text-gray-800 text-title-sm dark:text-white/90">{{ isLoading ? '...' : totalUsers }}</h4>
      </div>
      <div class="flex items-center justify-end gap-2">
      <app-badge color="success">
        <span [innerHTML]="icons.arrowUpIcon | safeHtml"></span>
        Active: {{ activeUsers }}
      </app-badge>
      <app-badge color="error">
        <span [innerHTML]="icons.arrowUpIcon | safeHtml"></span>
        In Active: {{ inActiveUsers }}
      </app-badge>
    </div>
    </div>
  </div>

  <!-- Metric Item Start -->
  <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] md:p-6">
    <div class="flex items-center justify-center w-12 h-12 bg-gray-100 rounded-xl dark:bg-gray-800" [innerHTML]="icons.boxIconLine| safeHtml">
    </div>
    <div class="flex items-end justify-between mt-5">
      <div>
        <span class="text-sm text-gray-500 dark:text-gray-400">My Tasks</span>
        <h4 class="mt-2 font-bold text-gray-800 text-title-sm dark:text-white/90">where all the task assigned to a memeber/project manager by the project manager will show here5,359</h4>
      </div>
     <!--
      <app-badge color="error">
        <span [innerHTML]="icons.arrowDownIcon | safeHtml"></span>
        9.05%
      </app-badge>
    </div>
    --> 
  </div>
  <!-- Metric Item End -->
</div>
