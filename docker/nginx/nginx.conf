server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public;

    # <<< NEW, FINAL CORS FIX: Dedicated OPTIONS location block >>>
    location ~ /api {
        # This handles all requests to /api (like /api/login)
        
        # Add headers to ALL responses here (Preflight & POST/GET)
        add_header 'Access-Control-Allow-Origin' 'http://localhost:4200';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        
        # Explicitly handle the OPTIONS preflight request
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            return 204; # Send success response without touching Laravel
        }
        
        # Fall through to the main location / block for processing if not OPTIONS
        try_files $uri $uri/ /index.php?$query_string;
    }
    # <<< END FINAL CORS FIX >>>


    location / {
        # Keep this simple, let the /api block handle API routing for CORS
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}